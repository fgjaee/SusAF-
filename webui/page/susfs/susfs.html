<div class="body-content constant-height" id="susfs-boxes">
    <!-- Config file boxes are generated by susfs.js from CONFIG_BOXES,
         each one its own separate card: Edit / Apply / Load Custom File. -->

    <div class="box translucent" id="capability-registry-box">
        <div class="box-header">
            <h2>Kernel Capability Routing</h2>
            <span class="entry-badge" id="capability-version">Detecting…</span>
        </div>
        <p class="box-description">
            Sus'AF reads the installed SUSFS/KernelSU capabilities and routes each feature to the supported backend.
        </p>
        <div class="capability-summary" id="capability-summary"></div>
        <div class="capability-list" id="capability-list"></div>
        <div class="capability-unmapped" id="capability-unmapped" hidden></div>
    </div>

    <!-- Toggles box: the only config file exposed as switches instead of
         raw text, since it's pure KEY=VALUE flags (config.txt) -->
    <div class="box translucent" id="toggles-box">
        <div class="box-header">
            <h2 data-i18n="toggles_title"></h2>
        </div>
        <p class="box-description" data-i18n="toggles_description"></p>

        <div class="toggle-row" id="toggle-hide-mnts">
            <div class="toggle-label">
                <span data-i18n="toggle_hide_mnts"></span>
                <small data-i18n="toggle_hide_mnts_desc"></small>
            </div>
            <md-switch icons></md-switch>
        </div>
        <div class="toggle-row" id="toggle-hide-mnts-late">
            <div class="toggle-label">
                <span data-i18n="toggle_hide_mnts_late"></span>
                <small data-i18n="toggle_hide_mnts_late_desc"></small>
            </div>
            <md-switch icons></md-switch>
        </div>
        <div class="toggle-row" id="toggle-allow-broad-umount">
            <div class="toggle-label">
                <span data-i18n="toggle_allow_broad_umount"></span>
                <small data-i18n="toggle_allow_broad_umount_desc"></small>
            </div>
            <md-switch icons></md-switch>
        </div>
        <div class="toggle-row" id="toggle-enable-log">
            <div class="toggle-label">
                <span data-i18n="toggle_enable_log"></span>
                <small data-i18n="toggle_enable_log_desc"></small>
            </div>
            <md-switch icons></md-switch>
        </div>
        <div class="toggle-row" id="toggle-avc-spoof">
            <div class="toggle-label">
                <span data-i18n="toggle_avc_spoof"></span>
                <small data-i18n="toggle_avc_spoof_desc"></small>
            </div>
            <md-switch icons></md-switch>
        </div>

        <div class="box-actions">
            <md-filled-button id="apply-toggles" data-i18n="toggles_apply"></md-filled-button>
        </div>
    </div>

    <!-- Safe inset -->
    <div class="placeholder"></div>
</div>
