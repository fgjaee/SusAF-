<div class="body-content constant-height diagnostics-page">
    <div class="box translucent diagnostics-status-card">
        <div class="diagnostics-status-row">
            <div class="diagnostics-status-dot" id="diagnostics-status-dot"></div>
            <div class="diagnostics-status-copy">
                <h2 id="diagnostics-status-title" data-i18n="diagnostics_loading"></h2>
                <p id="diagnostics-status-summary" data-i18n="diagnostics_loading_hint"></p>
            </div>
        </div>
        <p class="diagnostics-generated" id="diagnostics-generated"></p>
        <div class="diagnostics-actions">
            <md-filled-button id="diagnostics-refresh">
                <span data-i18n="diagnostics_refresh"></span>
            </md-filled-button>
            <md-filled-button id="diagnostics-export">
                <span data-i18n="diagnostics_export"></span>
            </md-filled-button>
        </div>
    </div>

    <div class="diagnostics-error" id="diagnostics-error" role="status"></div>

    <div id="diagnostics-content" class="diagnostics-content" hidden>
        <div class="box diagnostics-group coverage-assistant">
            <div class="coverage-heading">
                <div>
                    <h3 data-i18n="coverage_title"></h3>
                    <p data-i18n="coverage_description"></p>
                </div>
                <span class="coverage-readonly" data-i18n="coverage_autopilot"></span>
            </div>

            <div class="coverage-controls">
                <md-outlined-text-field
                    id="coverage-package"
                    data-i18n="coverage_package"
                    label="Android package"
                    placeholder="com.example.detector"
                    autocomplete="off">
                </md-outlined-text-field>
                <div class="coverage-scan-actions">
                    <md-filled-button id="coverage-system-scan" data-i18n="coverage_scan_system"></md-filled-button>
                    <md-filled-button id="coverage-app-scan" data-i18n="coverage_scan_app"></md-filled-button>
                </div>
            </div>

            <div class="coverage-message" id="coverage-message" role="status"></div>

            <div id="coverage-results" class="coverage-results" hidden>
                <div class="coverage-meta">
                    <strong id="coverage-result-title"></strong>
                    <span id="coverage-result-detail"></span>
                </div>

                <div class="coverage-summary-grid">
                    <div class="coverage-summary-item">
                        <strong id="coverage-map-candidates">0</strong>
                        <span data-i18n="coverage_map_candidates"></span>
                    </div>
                    <div class="coverage-summary-item">
                        <strong id="coverage-path-candidates">0</strong>
                        <span data-i18n="coverage_path_candidates"></span>
                    </div>
                    <div class="coverage-summary-item">
                        <strong id="coverage-mount-candidates">0</strong>
                        <span data-i18n="coverage_mount_candidates"></span>
                    </div>
                    <div class="coverage-summary-item">
                        <strong id="coverage-spoof-candidates">0</strong>
                        <span data-i18n="coverage_spoof_candidates"></span>
                    </div>
                </div>

                <div class="coverage-candidate-section">
                    <div class="coverage-candidate-heading">
                        <h4 data-i18n="coverage_exact_candidates"></h4>
                        <span data-i18n="coverage_select_hint"></span>
                    </div>
                    <div class="coverage-empty" id="coverage-empty" data-i18n="coverage_no_candidates"></div>
                    <div class="coverage-candidates" id="coverage-candidates"></div>
                    <div class="coverage-policy-actions">
                        <md-filled-tonal-button id="coverage-rollback" data-i18n="coverage_rollback"></md-filled-tonal-button>
                        <md-filled-tonal-button id="coverage-verify" data-i18n="coverage_verify"></md-filled-tonal-button>
                        <md-filled-button id="coverage-save-selected" disabled data-i18n="coverage_apply_generated"></md-filled-button>
                    </div>
                </div>

                <p class="coverage-limits" data-i18n="coverage_limits"></p>
            </div>
        </div>

        <md-dialog id="coverage-risk-dialog">
            <div slot="headline" data-i18n="coverage_risk_title"></div>
            <div slot="content">
                <p data-i18n="coverage_risk_message"></p>
                <div id="coverage-risk-list" class="coverage-risk-list"></div>
            </div>
            <div slot="actions">
                <md-text-button id="coverage-risk-cancel" data-i18n="global_cancel"></md-text-button>
                <md-filled-button id="coverage-risk-apply" data-i18n="coverage_apply_anyway"></md-filled-button>
            </div>
        </md-dialog>

        <div class="box diagnostics-group">
            <h3 data-i18n="diagnostics_runtime"></h3>
            <div class="diagnostics-rows" id="diagnostics-runtime-rows"></div>
        </div>

        <div class="box diagnostics-group">
            <h3 data-i18n="diagnostics_kernel_umount"></h3>
            <div class="diagnostics-rows" id="diagnostics-kernel-rows"></div>
        </div>

        <div class="box diagnostics-group">
            <h3 data-i18n="diagnostics_targets"></h3>
            <div class="diagnostics-count-grid" id="diagnostics-target-grid"></div>
        </div>

        <div class="box diagnostics-group">
            <h3 data-i18n="diagnostics_boot_state"></h3>
            <div class="diagnostics-rows" id="diagnostics-boot-rows"></div>
        </div>

        <div class="box diagnostics-group">
            <h3 data-i18n="diagnostics_adb"></h3>
            <div class="diagnostics-rows" id="diagnostics-adb-rows"></div>
        </div>

        <div class="box diagnostics-group">
            <h3 data-i18n="diagnostics_stages"></h3>
            <div class="diagnostics-rows" id="diagnostics-stage-rows"></div>
        </div>

        <div class="box diagnostics-group">
            <h3 data-i18n="diagnostics_migration_update"></h3>
            <div class="diagnostics-rows" id="diagnostics-migration-rows"></div>
        </div>

        <p class="diagnostics-privacy" data-i18n="diagnostics_privacy"></p>
    </div>

    <div class="placeholder"></div>
</div>
