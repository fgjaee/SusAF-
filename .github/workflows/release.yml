name: Build and release

on:
  push:
    branches:
      - susaf-dev
    tags:
      - 'v*'
    paths:
      - '.github/scripts/**'
      - '.github/workflows/release.yml'
      - '.node-version'
      - 'module/**'
      - 'tests/**'
      - 'webui/**'
      - 'update.json'
  workflow_dispatch:

permissions:
  contents: read

env:
  MODULE_NAME: 'SusAF'
  PNPM_VERSION: '11.22.0'

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.setup.outputs.version }}
      zip_name: ${{ steps.setup.outputs.zip_name }}
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
        persist-credentials: false

    - name: Setup pnpm
      uses: pnpm/action-setup@v6
      with:
        version: ${{ env.PNPM_VERSION }}

    - name: Setup Node
      uses: actions/setup-node@v7
      with:
        node-version-file: '.node-version'
        cache: 'pnpm'
        cache-dependency-path: webui/pnpm-lock.yaml

    - name: Lint and build WebUI
      run: |
        set -euo pipefail
        cd webui
        pnpm install --frozen-lockfile --config.verify-deps-before-run=false
        pnpm lint
        pnpm build

    - name: Static safety checks
      run: .github/scripts/check_repository_policy.sh

    - name: Test module scripts
      run: |
        set -euo pipefail
        for test_script in tests/test-*.sh; do
          "$test_script"
        done

    - name: Validate metadata
      run: |
        set -euo pipefail
        jq -e . update.json module/common/repo.json >/dev/null
        test "$(sed -n 's/^id=//p' module/module.prop)" = "susaf"
        test "$(sed -n 's/^name=//p' module/module.prop)" = "Sus’AF"
        test "$(sed -n 's/^version=//p' module/module.prop)" = "$(jq -r .version update.json)"
        test "$(sed -n 's/^versionCode=//p' module/module.prop)" = "$(jq -r .versionCode update.json)"
        grep -Eq '^source_commit=[0-9a-f]{40}$' module/update-manifest.properties
        grep -Eq '^sha256=[0-9a-f]{64}$' module/update-manifest.properties
        EXPECTED_SUSFS_SHA=$(sed -n 's/^sha256=//p' module/update-manifest.properties)
        test "$(sha256sum module/bin/ksu_susfs | awk '{ print $1 }')" = "$EXPECTED_SUSFS_SHA"
        for metadata_file in update.json module/module.prop module/common/repo.json; do
          grep -Fq 'fgjaee/SusAF-' "$metadata_file"
        done

    - name: Refuse development release
      if: startsWith(github.ref, 'refs/tags/')
      run: |
        set -euo pipefail
        VERSION=$(jq -r .version update.json)
        test "${GITHUB_REF_NAME}" = "${VERSION}" || {
          echo "Tag ${GITHUB_REF_NAME} does not match update.json version ${VERSION}" >&2
          exit 1
        }
        case "${VERSION}" in
          *-dev*) echo "Development versions cannot be published" >&2; exit 1 ;;
        esac

    - name: Set variables
      id: setup
      run: |
        set -euo pipefail
        VERSION=$(jq -r .version update.json)
        ZIP_NAME="${MODULE_NAME}_${VERSION#v}"
        echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
        echo "ZIP_NAME=${ZIP_NAME}" >> "$GITHUB_ENV"
        echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
        echo "zip_name=${ZIP_NAME}" >> "$GITHUB_OUTPUT"

    - name: Build reproducible module archives
      run: |
        set -euo pipefail
        SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)
        export SOURCE_DATE_EPOCH
        mkdir -p dist
        .github/scripts/package_module.sh module "dist/${ZIP_NAME}.zip"
        .github/scripts/package_module.sh module "dist/${ZIP_NAME}.repro.zip"
        cmp "dist/${ZIP_NAME}.zip" "dist/${ZIP_NAME}.repro.zip"
        cp "dist/${ZIP_NAME}.zip" dist/SusAF.zip
        rm "dist/${ZIP_NAME}.repro.zip"
        (
          cd dist
          sha256sum "${ZIP_NAME}.zip" SusAF.zip > SHA256SUMS
          sha256sum -c SHA256SUMS
        )
        unzip -t "dist/${ZIP_NAME}.zip"
        unzip -p "dist/${ZIP_NAME}.zip" module.prop | grep -Fqx 'id=susaf'
        unzip -p "dist/${ZIP_NAME}.zip" module.prop | grep -Fqx "name=Sus’AF"
        unzip -p "dist/${ZIP_NAME}.zip" update-manifest.properties \
          | grep -Eq '^source_commit=[0-9a-f]{40}$'
        unzip -Z1 "dist/${ZIP_NAME}.zip" | grep -Fqx 'bin/ksu_susfs'
        unzip -Z1 "dist/${ZIP_NAME}.zip" | grep -Fqx 'webroot/index.html'
        if unzip -Z1 "dist/${ZIP_NAME}.zip" | grep -E '(^/|(^|/)\.\.(/|$)|(^|/)(\.git|node_modules)(/|$))'; then
          echo 'Unsafe or development-only archive path found' >&2
          exit 1
        fi

    - name: Upload verified artifacts
      uses: actions/upload-artifact@v7
      with:
        name: ${{ steps.setup.outputs.zip_name }}
        if-no-files-found: error
        path: |
          dist/${{ steps.setup.outputs.zip_name }}.zip
          dist/SusAF.zip
          dist/SHA256SUMS

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Checkout changelog history
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
        persist-credentials: false

    - name: Download verified artifacts
      uses: actions/download-artifact@v7
      with:
        name: ${{ needs.build.outputs.zip_name }}
        path: dist

    - name: Generate changelog
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        FROM_REF=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || git rev-list --max-parents=0 HEAD)
        python .github/scripts/generate_changelog.py \
          --repo-slug "${GITHUB_REPOSITORY}" \
          --from "${FROM_REF}" \
          --to HEAD \
          --version "${{ needs.build.outputs.version }}" \
          --output changelog_body.md

    - name: Publish release
      env:
        GH_TOKEN: ${{ github.token }}
        VERSION: ${{ needs.build.outputs.version }}
        ZIP_NAME: ${{ needs.build.outputs.zip_name }}
      run: |
        set -euo pipefail
        PRERELEASE_FLAG=''
        case "$VERSION" in *-*) PRERELEASE_FLAG='--prerelease' ;; esac
        gh release create "$VERSION" \
          "dist/${ZIP_NAME}.zip" \
          "dist/SusAF.zip" \
          "dist/SHA256SUMS" \
          --title "Sus'AF ${VERSION}" \
          --notes-file changelog_body.md \
          $PRERELEASE_FLAG
